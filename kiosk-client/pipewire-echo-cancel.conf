# Echo cancellation for Nina: copy to ~/.config/pipewire/pipewire.conf.d/60-nina-echo-cancel.conf and restart pipewire
# (systemctl --user restart pipewire pipewire-pulse wireplumber). It adds a virtual microphone "nina_ec_source" with the speaker signal removed (WebRTC AEC) and a virtual
# speaker "nina_ec_sink" that plays to the normal output. The client uses them (see nina-kiosk.service), so Nina does not hear herself and can be interrupted.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name  = aec/libspa-aec-webrtc
      monitor.mode  = false
      capture.props  = { node.name = "nina_ec_capture" }
      source.props   = { node.name = "nina_ec_source" node.description = "Nina echo-cancelled microphone" }
      sink.props     = { node.name = "nina_ec_sink"   node.description = "Nina echo-cancelled speaker" }
      playback.props = { node.name = "nina_ec_playback" }
    }
  }
]
